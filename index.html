// ─────────────────────────────────────────────
// SCORING ENGINE
// ─────────────────────────────────────────────
function rankPatterns(answers) {
  return PATTERNS
    .map(p => ({ ...p, raw: p.score(answers) }))
    .sort((a,b) => b.raw - a.raw);
}

function normalizeScores(ranked) {
  const max = ranked[0].raw || 1;
  return ranked.map(p => ({ ...p, pct: Math.round(p.raw / max * 100) }));
}

// ─────────────────────────────────────────────
// CLEANSING LOGIC
// ─────────────────────────────────────────────
function needsCleansing(answers) {
  const daily = answers.daily_items || [];
  if(daily.includes('none') || daily.length === 0) return {needed:false};
  const triggers = [];
  if(daily.includes('sunscreen'))  triggers.push('日焼け止め');
  if(daily.includes('uv_cream'))   triggers.push('UVカット入りクリーム');
  if(daily.includes('makeup'))     triggers.push('BBクリーム・ファンデーション');
  if(daily.includes('wax'))        triggers.push('整髪料（前髪への付着）');
  return triggers.length > 0 ? {needed:true, triggers} : {needed:false};
}

  return {am, pm, cleans};
}

function buildIngredients(answers, patternId) {
  const trouble = answers.trouble || [];
  const items = [];
  const add = (name, key) => { if(!items.find(i=>i.name===name)) items.push({name,key}); };

  if(['oily_acne','stressed'].includes(patternId) || trouble.includes('acne')) {
    add('ナイアシンアミド', true); add('BHA（サリチル酸）', true);
    add('ティーツリー', false); add('アゼライン酸', false);
  }
  if(['dry_sensitive'].includes(patternId) || trouble.includes('dry_c')) {
    add('セラミド', true); add('ヒアルロン酸', true);
    add('スクワラン', false); add('シアバター', false);
  }
  if(['glow','outdoor_uv'].includes(patternId) || trouble.includes('dull')) {
    add('ビタミンC誘導体', true); add('トラネキサム酸', false);
    add('アルブチン', false);
  }
  if(['aging','combo_aging'].includes(patternId) || trouble.includes('aging')) {
    add('レチノール', true); add('ペプチド', true);
    add('コエンザイムQ10', false);
  }
  if(trouble.includes('pore') || patternId === 'combo') {
    add('AHA（グリコール酸）', true); add('クレイ（高嶺土）', false);
  }
  if(patternId === 'stressed') {
    add('アズレン', true); add('パンテノール', true); add('アラントイン', false);
  }
  add('SPF/PA++', true);
  add('ヒアルロン酸', false);
  add('グリセリン', false);
  return items;
}

function buildSkinScores(answers, patternId) {
  const isOily = answers.afterwash?.includes('oily');
  const isDry  = answers.afterwash?.includes('dry');
  const life   = answers.lifestyle || [];
  const daily  = answers.daily_items || [];
  return [
    {
      label:'Moisture',
      val: isDry ? 25 : isOily ? 55 : 72,
      note: isDry ? 'Low' : isOily ? 'Mid' : 'Good'
    },
    {
      label:'Sebum',
      val: isOily ? 88 : answers.afterwash?.includes('combo') ? 60 : 32,
      note: isOily ? 'High' : answers.afterwash?.includes('combo') ? 'Mid' : 'Low'
    },
    {
      label:'Sensitivity',
      val: answers.trouble?.includes('sensitive') ? 82 :
           life.includes('irregular') || life.includes('smoking') ? 65 :
           isDry ? 60 : 35,
      note: answers.trouble?.includes('sensitive') ? 'High' : 'Normal'
    },
    {
      label:'UV Risk',
      val: (daily.includes('none') && life.includes('outdoor')) ? 90 :
           life.includes('outdoor') ? 70 :
           daily.includes('sunscreen') || daily.includes('uv_cream') ? 20 : 55,
      note: daily.includes('sunscreen') || daily.includes('uv_cream') ? 'Managed' : 'Risk'
    },
  ];

// STATE
// ─────────────────────────────────────────────
let currentQ = 0;
const answers = {};

// ─────────────────────────────────────────────
// RENDER QUESTION
// ─────────────────────────────────────────────
function renderQ() {
  const q = QUESTIONS[currentQ];
  const total = QUESTIONS.length;

  document.getElementById('q-step').textContent = 'Q' + (currentQ+1);
  document.getElementById('q-category').textContent = q.category;
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('q-hint').textContent = q.hint || '';
  document.getElementById('progress-frac').textContent = (currentQ+1) + ' / ' + total;
  document.getElementById('progress-fill').style.width = (currentQ / total * 100) + '%';
  document.getElementById('btn-back').style.visibility = currentQ === 0 ? 'hidden' : 'visible';

  const sel = answers[q.id] || [];
  const wrap = document.getElementById('options-wrap');
  wrap.innerHTML = '';

  q.options.forEach(opt => {
    const isSelected = sel.includes(opt.value);
    const btn = document.createElement('button');
    btn.className = 'opt' + (isSelected ? ' selected' : '');
    btn.dataset.value = opt.value;
    btn.innerHTML = `
      <span class="opt-check">
        <svg class="opt-check-mark" viewBox="0 0 12 12" fill="none">
          <path d="M2 6l3 3 5-5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="opt-body">
        <span class="opt-text">${opt.text}</span>
        ${opt.sub ? `<span class="opt-sub">${opt.sub}</span>` : ''}
      </span>`;
    btn.onclick = () => toggleOpt(q, opt, btn);
    wrap.appendChild(btn);
  });

  updateNextBtn(q);
  const qs = document.getElementById('quiz-screen');
  qs.style.animation = 'none';
  void qs.offsetWidth;
  qs.style.animation = 'fadeup 0.35s ease';
}

function toggleOpt(q, opt, btn) {
  if(!answers[q.id]) answers[q.id] = [];
  const vals = answers[q.id];

  if(q.multi) {
    if(opt.exclusive) {
      answers[q.id] = vals.includes(opt.value) ? [] : [opt.value];
    } else {
      answers[q.id] = vals.filter(v => !q.options.find(o => o.value===v && o.exclusive));
      if(vals.includes(opt.value)) answers[q.id] = answers[q.id].filter(v => v !== opt.value);
      else answers[q.id].push(opt.value);
    }
  } else {
    answers[q.id] = [opt.value];
  }

  document.querySelectorAll('.opt').forEach(b => {
    b.classList.toggle('selected', answers[q.id].includes(b.dataset.value));
  });
  updateNextBtn(q);
}

function updateNextBtn(q) {
  document.getElementById('btn-next').disabled = !(answers[q.id]?.length > 0);
}

function nextQ() {
  if(!(answers[QUESTIONS[currentQ].id]?.length > 0)) return;
  if(currentQ === 0) gtag('event', 'quiz_start', { site: 'SKIN CODE' });
  gtag('event', 'quiz_progress', { site: 'SKIN CODE', question: currentQ + 1, total: QUESTIONS.length });
  if(currentQ < QUESTIONS.length - 1) { currentQ++; renderQ(); }
  else showLoading();
}

function prevQ() {
  if(currentQ > 0) { currentQ--; renderQ(); }
}

// LOADING
// ─────────────────────────────────────────────
const LOAD_PHASES = [
  {text:'> ANALYZING_SKIN_TYPE', pct:15},
  {text:'> PROCESSING_LIFESTYLE_DATA', pct:30},
  {text:'> RUNNING_PATTERN_SCORING', pct:45},
  {text:'> MATCHING_YOUR_PROFILE', pct:58},
  {text:'> CALCULATING_CLEANSING_NEEDS', pct:70},
  {text:'> BUILDING_ROUTINE_ARRAY', pct:82},
  {text:'> SELECTING_KEY_INGREDIENTS', pct:92},
  {text:'> CODE_COMPILED', pct:100},
];

function showLoading() {
  const quizEl = document.getElementById('quiz-screen');
  const loadEl = document.getElementById('loading-screen');
  const barEl = document.getElementById('loading-bar');
  const phaseEl = document.getElementById('loading-phase');

  // Fade out quiz
  quizEl.classList.add('screen-exit');
  setTimeout(() => {
    quizEl.style.display = 'none';
    quizEl.classList.remove('screen-exit');
    loadEl.style.display = 'block';
    loadEl.classList.add('screen-enter');
    barEl.style.width = '0%';

    // Animate phases with progress bar
    let pi = 0;
    const iv = setInterval(() => {
      if(pi >= LOAD_PHASES.length) { clearInterval(iv); return; }
      phaseEl.style.opacity = 0;
      const phase = LOAD_PHASES[pi];
      setTimeout(() => {
        phaseEl.textContent = phase.text;
        phaseEl.style.opacity = 1;
        barEl.style.width = phase.pct + '%';
      }, 120);
      pi++;
    }, 520);

    setTimeout(() => { clearInterval(iv); showResult(); }, 4400);
  }, 300);
}

function showResult() {

  });

  const ranked = normalizeScores(rankPatterns(a));
  const top = ranked[0];
  const routine = buildRoutine(a, top.id);
  const ingredients = buildIngredients(a, top.id);
  const advice = buildAdvice(a, top.id);

        <div class="clinic-cta-body">
          <div class="clinic-cta-label">Clinic Guide</div>
          <div class="clinic-cta-title">ニキビ・肌荒れに対応するクリニック一覧を見る</div>
          <div class="clinic-cta-desc">オンラインで相談できる美容皮膚科クリニックを比較できます</div>

    </div>`;
    })()}

      <p style="font-size:12px;color:#888;margin-bottom:8px;">気になる商品は楽天市場でもチェック</p>
      <a href="//af.moshimo.com/af/c/click?a_id=5452479&p_id=54&pc_id=54&pl_id=620" rel="nofollow sponsored" referrerpolicy="no-referrer-when-downgrade" attributionsrc><img src="//image.moshimo.com/af-img/0032/000000000620.gif" width="468" height="60" style="border:none;max-width:100%;height:auto;" alt="楽天市場"></a>

        THREADS
      </a>
      <button class="share-grid-btn share-copy" id="copy-btn" onclick="copyResult('${top.name}','${top.ja}')">
        <span class="share-grid-icon">🔗</span>
        COPY
      </button>
    </div>

    <button class="retake-btn-dash" onclick="retake()">REBOOT DIAGNOSIS</button>

    <div style="margin-top:12px;padding:1rem;background:#f6f8fb;border:1px solid rgba(26,78,128,0.1);border-radius:10px;">
      <div style="font-family:'DM Mono',monospace;font-size:0.55rem;letter-spacing:0.14em;color:#5a7d8a;text-transform:uppercase;margin-bottom:0.6rem;">Reference — 参考情報</div>
      <div style="font-size:0.7rem;color:#5a7d8a;line-height:1.8;">
        ※ 本ツールは医療行為・医師による診断ではありません。正確な肌トラブルの診断は皮膚科を受診してください。<br>
        <a href="https://www.dermatol.or.jp/" target="_blank" rel="noopener" style="color:#1a4e80;">日本皮膚科学会</a> ｜

    <a href="https://aga-site.vercel.app/" class="cross-banner" target="_blank" rel="noopener">
      <span class="cross-icon">💇</span>
      <span class="cross-body">
        <span class="cross-label">Another Self-Check</span>

      <span class="cross-icon">💊</span>
      <span class="cross-body">
        <span class="cross-label">Another Self-Check</span>
        <span class="cross-title">ED CODE — 男性ED セルフチェック</span>

      <span class="cross-icon">👃</span>
      <span class="cross-body">
        <span class="cross-label">Another Self-Check</span>
        <span class="cross-title">SMELL CODE — 体臭・ワキガ セルフチェック</span>
        <span class="cross-desc">体臭の原因を優先順位でスコアリング。においの悩みが気になる方はこちらもチェック。</span>

  const loadEl = document.getElementById('loading-screen');
  loadEl.classList.add('screen-exit');
  setTimeout(() => {
    loadEl.style.display = 'none';
    loadEl.classList.remove('screen-exit', 'screen-enter');
    el.style.display = 'block';
    el.classList.add('screen-enter');
    window.scrollTo({top:0, behavior:'smooth'});
  }, 300);

  setTimeout(() => {
    el.querySelectorAll('.score-bar').forEach(b => b.style.width = b.dataset.val + '%');
    el.querySelectorAll('.match-bar').forEach(b => b.style.width = b.dataset.val + '%');
  }, 300);

  const shareText = `【SKINCODE診断】私の肌タイプ → ${top.name}（${top.ja}）\n${top.tagline.slice(0,40)}…\n`;
  const xBtn = el.querySelector('#share-x');
  if(xBtn) xBtn.href = `https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(location.href)}`;
  const threadsBtn = el.querySelector('#share-threads');
  if(threadsBtn) threadsBtn.href = `https://www.threads.net/intent/post?text=${encodeURIComponent(shareText + location.href)}`;

function copyResult(name, ja) {
  gtag('event', 'share', { method: 'copy', site: 'SKIN CODE', content_type: 'result' });
  navigator.clipboard.writeText(`【SKINCODE診断】肌タイプ：${name}（${ja}）\n${location.href}`).then(() => {
    const btn = document.getElementById('copy-btn');
    if(btn) { btn.textContent = '✓ コピー完了'; setTimeout(() => { btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> コピー'; }, 2000); }
  });
}

function retake() {
  gtag('event', 'quiz_retake', { site: 'SKIN CODE' });
  currentQ = 0;
  Object.keys(answers).forEach(k => delete answers[k]);
  const resultEl = document.getElementById('result-screen');
  resultEl.classList.add('screen-exit');
  setTimeout(() => {
    resultEl.style.display = 'none';
    resultEl.innerHTML = '';
    resultEl.classList.remove('screen-exit', 'screen-enter');
    const quizEl = document.getElementById('quiz-screen');
    quizEl.style.display = 'block';
    quizEl.classList.add('screen-enter');
    renderQ();
    window.scrollTo({top:0, behavior:'smooth'});
  }, 300);
}

renderQ();
